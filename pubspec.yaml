name: storeflow_pos
description: Offline-first Windows point of sale for modern businesses.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.3.0
  collection: ^1.19.1
  cryptography: ^2.9.0
  crypto: ^3.0.7
  csv: ^8.0.0
  drift: ^2.35.0
  ffi: ^2.2.0
  file_picker: ^13.1.0
  fl_chart: ^1.2.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.13.1
  printing: ^5.15.1
  shared_preferences: ^2.5.5
  sqlite3: ^3.6.0
  talker_flutter: ^5.1.20
  uuid: ^4.6.0
  window_manager: ^0.5.2
  flex_color_scheme: 8.3.0
  dynamic_color: 1.7.0
  flutter_animate: ^4.5.2
  camera: ^0.12.1
  camera_windows: ^0.3.0
  image: ^4.10.1
  calendar_date_picker2: ^3.0.0
  flutter_zxing: ^3.1.0

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  msix: ^3.18.0

flutter:
  uses-material-design: true

# Microsoft Store package (dart run msix:create). Replace the three values
# marked PARTNER CENTER with the ones shown in Partner Center → your app →
# Product management → Product identity before building the store package.
# See docs/store/MICROSOFT_STORE_RELEASE.md.
msix_config:
  display_name: StoreFlow POS
  publisher_display_name: XWS # PARTNER CENTER: Publisher display name
  identity_name: XWS.StoreFlowPOS # PARTNER CENTER: Package/Identity/Name
  publisher: CN=XWS # PARTNER CENTER: Package/Identity/Publisher
  msix_version: 1.0.0.0
  description: Offline point of sale for shops and stores on Windows.
  logo_path: assets/branding/storeflow_icon.png
  start_menu_icon_path: assets/branding/storeflow_icon.png
  tile_icon_path: assets/branding/storeflow_icon.png
  icons_background_color: transparent
  languages: en-us
  architecture: x64
  # webcam: camera barcode scanning. Printing, file pickers, backups and the
  # local database need no extra capability for a desktop (full trust) app.
  capabilities: webcam
  store: true
